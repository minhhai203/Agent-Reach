<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nộp video — Nhịp đăng</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f6f6f2}.submit-page{max-width:560px;margin:8vh auto;padding:24px}.submit-brand{font-size:20px;font-weight:800;color:#1d483c;text-decoration:none}.submit-card{background:white;border:1px solid #e5e8e4;border-radius:20px;padding:32px;margin-top:32px;box-shadow:0 12px 40px #2442320b}.submit-card h1{font-size:32px;letter-spacing:-.04em;margin:12px 0}.submit-card p{color:#66716a;line-height:1.6}.submit-card label{display:block;font-weight:650;margin-top:18px}.submit-card input,.submit-card select{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #d8dfda;border-radius:9px;background:#fff;font:inherit}.submit-card button{margin-top:24px;width:100%}.submit-message{margin-top:18px}.submit-hint{font-size:13px;color:#69736d}.submit-back{display:inline-block;margin-top:24px;color:#416a5b} @media(max-width:600px){.submit-page{margin:2vh auto;padding:16px}.submit-card{padding:24px}}
</style></head><body><main class="submit-page"><a class="submit-brand" href="/">n. &nbsp;nhịp đăng</a><section class="submit-card"><div class="kicker">MỘT BƯỚC MỖI NGÀY</div><h1>Nộp video của bạn.</h1><p>Dán link TikTok hoặc YouTube và chọn ngày đăng. Người hướng dẫn sẽ xem lại thông tin bạn gửi.</p><form id="submit-form"><label>Học viên<select id="student" name="student_id" required><option value="">Đang tải danh sách…</option></select></label><label>Link video<input name="url" type="url" placeholder="https://www.tiktok.com/..." required></label><label>Ngày đăng<input name="published_at" type="date" required></label><label>Tiêu đề <span class="submit-hint">(không bắt buộc)</span><input name="title" maxlength="300" placeholder="Tên video của bạn"></label><button class="button primary" type="submit">Gửi video ↗</button><div class="submit-message" role="status" aria-live="polite"></div></form><p class="submit-hint">Dữ liệu do bạn cung cấp và chưa được xác minh tự động. Trang thử nghiệm chỉ hoạt động trên máy đang chạy ứng dụng.</p></section><a class="submit-back" href="/">← Về trang theo dõi</a></main><script src="/submit.js"></script></body></html>
