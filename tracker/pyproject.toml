[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video_tracker"
version = "0.1.0"
description = "Theo dõi học viên đăng video TikTok/YouTube hằng tuần."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Code viết và test với mcp 1.27.x; mcp 2.x đổi API (httpx2, starlette 1.x) nên chặn lại.
    "mcp>=1.27,<2",
    "pydantic>=2.11",
    "httpx>=0.27,<1",
    "starlette>=0.41,<1",
    "uvicorn>=0.32",
    "anyio>=4",
    "tzdata",
    "yt-dlp",
]

[project.scripts]
tracker = "video_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["video_tracker", "video_tracker.*"]
exclude = ["legacy", "legacy.*", "tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
